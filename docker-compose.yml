  #   volumes:
  #     - ./examples:/app/examples
  #     - ./flowmix:/app/flowmix
  #   command: python examples/deployment.py
  #   restart: unless-stopped
  #   networks:
  #     - flowmix-network

  # Redis Commander - Web UI 管理工具（可选）
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: flowmix-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - flowmix-network

volumes:
  redis_data:
    driver: local
  # postgres_data:
