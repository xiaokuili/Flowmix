version: '3.8'

services:
  # Redis 服务 - 任务队列和缓存存储
  redis:
    image: redis:7-alpine
    container_name: flowmix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flowmix-network

  # PostgreSQL 服务（可选）
