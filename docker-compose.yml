  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U flowmix"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - flowmix-network

  # Flowmix Worker 服务（可选 - 用于独立部署 worker）
  # flowmix-worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: flowmix-worker
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     - REDIS_URL=redis://redis:6379/0
