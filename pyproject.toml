[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmix"
version = "0.5.2"
description = "简洁灵活的任务队列框架（基于 SQLite）"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Vincent", email = "lenglengzailuguan@gmail.com"}
]
keywords = ["task", "queue", "worker", "sqlite", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xiaokuili/Flowmix"
Repository = "https://github.com/xiaokuili/Flowmix"
Issues = "https://github.com/xiaokuili/Flowmix/issues"

# 可选功能依赖
[project.optional-dependencies]
http = ["aiohttp>=3.8"]
llm = ["openai>=1.0"]
storage = ["asyncpg>=0.28"]
all = ["aiohttp>=3.8", "openai>=1.0", "asyncpg>=0.28"]

[tool.setuptools]
packages = {find = {}}
