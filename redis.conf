# Redis 配置文件 - Flowmix 持久化配置
# 适用于生产环境部署

# ==================== 持久化配置 ====================

# RDB 快照持久化
# 格式: save <seconds> <changes>
# 说明: 在指定时间内如果有指定数量的 key 变化，就保存快照
save 900 1      # 900秒（15分钟）内至少1个key变化
save 300 10     # 300秒（5分钟）内至少10个key变化
save 60 10000   # 60秒（1分钟）内至少10000个key变化

# RDB 快照文件名
dbfilename dump.rdb

# 数据目录
dir /data

# RDB 压缩（建议开启）
rdbcompression yes

# RDB 文件校验
rdbchecksum yes

# AOF 持久化（追加文件）
appendonly yes
appendfilename "appendonly.aof"

# AOF 同步策略
# - always: 每次写入都同步（最安全，最慢）
# - everysec: 每秒同步一次（推荐，平衡性能和安全）
# - no: 让操作系统决定（最快，但可能丢数据）
appendfsync everysec

# 在 BGSAVE 或 BGREWRITEAOF 时不执行 fsync
no-appendfsync-on-rewrite no

# AOF 自动重写配置
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF 混合持久化（Redis 4.0+）
# 结合 RDB 和 AOF 的优点，恢复速度快
aof-use-rdb-preamble yes

# ==================== 内存管理 ====================

# 最大内存限制（根据实际情况调整）
maxmemory 512mb

# 内存淘汰策略
# - allkeys-lru: 所有 key 使用 LRU 算法淘汰（推荐用于缓存）
# - volatile-lru: 只对设置了过期时间的 key 使用 LRU
# - allkeys-lfu: 所有 key 使用 LFU 算法（Redis 4.0+）
# - noeviction: 不淘汰，内存满时报错（推荐用于队列）
maxmemory-policy allkeys-lru

# ==================== 网络配置 ====================

# 监听地址（0.0.0.0 允许外部访问）
bind 0.0.0.0

# 保护模式（Docker 内部网络可关闭）
protected-mode no

# 端口
port 6379

# 超时时间（0表示永不超时）
timeout 0

# TCP keepalive
tcp-keepalive 300

# ==================== 安全配置 ====================

# 密码认证（生产环境强烈建议设置）
# requirepass your_strong_password_here

# 禁用危险命令（生产环境建议）
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command SHUTDOWN ""

# ==================== 性能优化 ====================

# 数据库数量
databases 16

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 客户端连接配置
maxclients 10000

# ==================== 日志配置 ====================

# 日志级别: debug, verbose, notice, warning
loglevel notice

# 日志文件（空字符串表示输出到标准输出）
logfile ""

# ==================== 高可用配置 ====================

# 主从复制配置（如需配置）
# replicaof <masterip> <masterport>
# masterauth <master-password>

# 哨兵模式（如需配置）
# sentinel monitor mymaster 127.0.0.1 6379 2

# ==================== 其他配置 ====================

# 允许后台保存失败时继续写入
stop-writes-on-bgsave-error yes

# Lua 脚本超时时间（毫秒）
lua-time-limit 5000
